[project]
name = "glitch-airdrop-farm"
version = "0.1.0"
description = "AI-orchestrated multi-wallet airdrop farming"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "pynacl>=1.5",
  "eth-account>=0.13",
  "web3>=7.0",
  "solders>=0.21",
  "httpx>=0.27",
  "tenacity>=8.2",
  "structlog>=24.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "click>=8.1",
  "anyio>=4.3",
  "python-dotenv>=1.0",
  "google-auth>=2.34",
  "google-api-python-client>=2.149",
]

[project.scripts]
farm = "farm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
